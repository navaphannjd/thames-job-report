<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-form {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .login-form::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .login-icon i {
            font-size: 36px;
            color: white;
        }

        .login-form h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-form .subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
        }

        .login-form input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .login-form input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .login-form input::placeholder {
            color: #bbb;
        }

        .login-form button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .login-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .login-form button:active {
            transform: translateY(0);
        }

        .login-form button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .register-link p {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .register-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .register-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-content {
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: white;
            font-size: 16px;
            font-weight: 500;
        }

        .button-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .button-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        button.loading .button-spinner {
            display: block;
        }

        button.loading .button-text {
            display: none;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #c33;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message i {
            margin-right: 8px;
        }

        @media (max-width: 768px) {
            .login-form {
                padding: 30px 25px;
            }

            .login-form h1 {
                font-size: 24px;
            }

            .login-icon {
                width: 70px;
                height: 70px;
            }

            .login-icon i {
                font-size: 32px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .login-form {
                padding: 25px 20px;
            }

            .login-form h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">กำลังเข้าสู่ระบบ...</div>
        </div>
    </div>

    <div class="login-container">
        <div class="login-form">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-user-circle"></i>
                </div>
                <h1>ยินดีต้อนรับ</h1>
                <p class="subtitle">เข้าสู่ระบบเพื่อดำเนินการต่อ</p>
            </div>

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <form onsubmit="loginUser(event)">
                <div class="form-group">
                    <label for="username">ล็อกอิน</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="กรอกล็อกอิน" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่าน" required>
                    </div>
                </div>

                <button type="submit" id="loginBtn">
                    <div class="button-content">
                        <div class="button-spinner"></div>
                        <span class="button-text">
                            <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
                        </span>
                    </div>
                </button>
            </form>

            <div class="register-link">
                <p>ยังไม่มีบัญชีผู้ใช้?</p>
                <a href="register.html" class="register-btn">
                    <i class="fas fa-user-plus"></i>
                    สมัครสมาชิก
                </a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://45.136.237.60:3000';

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorElement.classList.add('show');

            setTimeout(() => {
                errorElement.classList.remove('show');
            }, 5000);
        }

        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('show');
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginBtn').classList.add('loading');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').classList.remove('loading');
        }

        // Callback สำหรับ Google Sheets
        function handleGoogleSheetsResponse(result) {
            console.log('Google Sheets Response:', result);

            if (result.result === "success") {
                // เก็บข้อมูลจาก Google Sheets
                sessionStorage.setItem('user', JSON.stringify({
                    loginId: result.username || '',
                    firstName: result.firstName,
                    lastName: result.lastName,
                    role: result.role,
                    branchInfo: result.branchInfo,
                    source: 'google_sheets'
                }));

                const loadingText = document.querySelector('.loading-text');
                loadingText.textContent = 'เข้าสู่ระบบสำเร็จ!';

                setTimeout(() => {
                    window.location.href = "job-report.html";
                }, 800);
            } else {
                hideLoading();
                showError("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
            }
        }

        // ลอง Login ผ่าน MySQL ก่อน
        async function tryMySQLLogin(username, password) {
            try {
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        loginId: username,
                        password: password
                    })
                });

                const result = await response.json();
                console.log('MySQL Response:', result);
                console.log('🔍 Locations from API:', result.user?.locations);
                console.log('🔍 Locations type:', typeof result.user?.locations);
                console.log('🔍 Locations length:', result.user?.locations?.length);

                if (response.ok && result.success) {
                    // เช็คสถานะ active
                    if (result.user.active === 0 || result.user.active === '0') {
                        hideLoading();
                        showError("บัญชีของคุณถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ");
                        return true;
                    }

                    // Login สำเร็จผ่าน MySQL
                    sessionStorage.setItem('user', JSON.stringify({
                        id: result.user.id,
                        loginId: result.user.loginId,
                        password: result.user.password,
                        employeeId: result.user.employeeId,
                        firstName: result.user.firstName,
                        lastName: result.user.lastName,
                        citizenId: result.user.citizenId,
                        nickname: result.user.nickname,
                        mobile: result.user.mobile,
                        address: result.user.address,
                        province: result.user.province,
                        postalCode: result.user.postalCode,
                        email: result.user.email,
                        role: result.user.role,
                        locations: result.user.locations,
                        source: 'mysql'
                    }));


                    console.log('💾 Saved to sessionStorage:', JSON.parse(sessionStorage.getItem('user')));

                    const loadingText = document.querySelector('.loading-text');
                    loadingText.textContent = 'เข้าสู่ระบบสำเร็จ!';

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 800);

                    return true;
                }

                if (response.status === 403) {
                    hideLoading();
                    showError(result.message || "บัญชีของคุณถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ");
                    return true;
                }

                return false;
            } catch (error) {
                console.error('MySQL Login Error:', error);
                return false;
            }
        }

        // ลอง Login ผ่าน Google Sheets
        function tryGoogleSheetsLogin(username, password) {
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxp6qoWZ36xcBuj7wteNFbyL4dF3EvzI2_XpfO5zYkUEb1odl60nQQUOlZB3gw4QNrfWA/exec';

            const url = scriptURL +
                '?username=' + encodeURIComponent(username) +
                '&password=' + encodeURIComponent(password) +
                '&callback=handleGoogleSheetsResponse';

            const script = document.createElement('script');
            script.src = url;
            script.onerror = function () {
                hideLoading();
                showError("ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง");
            };
            document.body.appendChild(script);
        }

        async function loginUser(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError("กรุณากรอกชื่อผู้ใช้และรหัสผ่าน");
                return;
            }

            showLoading();

            console.log('Attempting login for:', username);

            // ลอง MySQL ก่อน
            const mysqlSuccess = await tryMySQLLogin(username, password);

            // ถ้า MySQL ไม่สำเร็จ ให้ลอง Google Sheets
            if (!mysqlSuccess) {
                console.log('MySQL login failed, trying Google Sheets...');
                tryGoogleSheetsLogin(username, password);
            }
        }
    </script>
</body>


</html>
